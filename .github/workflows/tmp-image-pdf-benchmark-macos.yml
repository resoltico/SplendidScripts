name: Temporary image-to-PDF benchmark — macOS

on:
  push:
    branches:
      - tmp-image-pdf-benchmark-20260904

permissions:
  contents: read

concurrency:
  group: tmp-image-pdf-benchmark-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark-macos:
    runs-on: macos-15
    timeout-minutes: 330
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      MAGICK_THREAD_LIMIT: "4"
      VIPS_CONCURRENCY: "4"
      OMP_NUM_THREADS: "4"
      GOMAXPROCS: "4"
      BENCHMARK_REPEATS: "4"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reconstruct and verify benchmark harness
        shell: bash
        run: |
          set -euo pipefail
          cat .benchmark/current-chunks/part-* > .benchmark/run_benchmark.py.gz
          echo '6f17bf64066064856265acc8a34a356c478064e644859b29ac1ef68e832f823a  .benchmark/run_benchmark.py.gz' \
            | shasum -a 256 --check
          gzip --decompress --stdout .benchmark/run_benchmark.py.gz > .benchmark/run_benchmark.py
          echo '95961a6af209d391e13e653cfefb5e0fa7450b26a52bde33d153e4cf7fdb9156  .benchmark/run_benchmark.py' \
            | shasum -a 256 --check
          mkdir -p benchmark-artifacts/harness
          cp .benchmark/run_benchmark.py benchmark-artifacts/harness/run_benchmark.py
          shasum -a 256 .benchmark/run_benchmark.py > benchmark-artifacts/harness/SHA256SUMS

      - name: Install macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          brew install imagemagick vips qpdf pdfcpu poppler
          python3 -m venv .benchmark/venv
          .benchmark/venv/bin/python -m pip install --disable-pip-version-check \
            numpy pillow psutil
          .benchmark/venv/bin/python -m py_compile .benchmark/run_benchmark.py

      - name: Install pinned cpdf binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .benchmark/bin
          case "$(uname -m)" in
            arm64) cpdf_dir=MacOS-ARM ;;
            x86_64) cpdf_dir=MacOS-Intel ;;
            *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/coherentgraphics/cpdf-binaries/6341ce3699e46659bb2b59c216f37d2829ea97f8/${cpdf_dir}/cpdf" \
            --output .benchmark/bin/cpdf
          chmod 0755 .benchmark/bin/cpdf
          shasum -a 256 .benchmark/bin/cpdf > benchmark-artifacts/harness/tool-binary-SHA256SUMS
          printf '%s\n' "$GITHUB_WORKSPACE/.benchmark/bin" >> "$GITHUB_PATH"

      - name: Smoke-test complete tool capabilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .benchmark/smoke
          .benchmark/venv/bin/python - <<'PY'
          from PIL import Image
          Image.new('RGB', (400, 600), (120, 180, 220)).save('.benchmark/smoke/input.jpg', quality=92)
          PY
          magick -version
          magick .benchmark/smoke/input.jpg -format '%w %h\n' info:
          vips --version
          cpdf -jpeg .benchmark/smoke/input.jpg -o .benchmark/smoke/cpdf.pdf
          cpdf -scale-page '1.4886 1.4030' .benchmark/smoke/cpdf.pdf -o .benchmark/smoke/cpdf-a4.pdf
          pdfcpu import -- 'dim:595.44 841.68, pos:c, dpi:300' \
            .benchmark/smoke/pdfcpu.pdf .benchmark/smoke/input.jpg
          qpdf --check .benchmark/smoke/cpdf-a4.pdf
          qpdf --check .benchmark/smoke/pdfcpu.pdf
          rm -rf .benchmark/smoke

      - name: Record tool probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts/probes
          {
            echo '## Host'
            sw_vers
            uname -a
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            echo '## ImageMagick'
            magick -version 2>&1
            echo '## vips'
            vips --version 2>&1
            echo '## vips thumbnail help'
            vips thumbnail --help-operation 2>&1
            echo '## vips gravity help'
            vips gravity --help-operation 2>&1
            echo '## cpdf'
            cpdf -version 2>&1
            echo '## qpdf'
            qpdf --version 2>&1
            echo '## pdfcpu'
            pdfcpu version 2>&1
            echo '## pdfcpu import help'
            pdfcpu help import 2>&1
          } | tee benchmark-artifacts/probes/tool-probes.txt

      - name: Run complete randomized benchmark
        shell: bash
        run: |
          set -euo pipefail
          .benchmark/venv/bin/python .benchmark/run_benchmark.py \
            --output benchmark-artifacts \
            2>&1 | tee benchmark-artifacts/benchmark-console.log

      - name: Upload raw evidence and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-pdf-benchmark-macos-${{ github.run_id }}
          path: |
            benchmark-artifacts/REPORT.md
            benchmark-artifacts/SHA256SUMS
            benchmark-artifacts/*.csv
            benchmark-artifacts/*.json
            benchmark-artifacts/*.log
            benchmark-artifacts/harness/
            benchmark-artifacts/logs/
            benchmark-artifacts/probes/
            benchmark-artifacts/representative-outputs/
            benchmark-artifacts/visual-qa/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
