name: Temporary image-to-PDF benchmark

on:
  push:
    branches:
      - tmp-image-pdf-benchmark-20260904

permissions:
  contents: read

concurrency:
  group: tmp-image-pdf-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      MAGICK_THREAD_LIMIT: "4"
      VIPS_CONCURRENCY: "4"
      OMP_NUM_THREADS: "4"
      GOMAXPROCS: "4"
      BENCHMARK_REPEATS: "4"
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reconstruct and verify benchmark harness
        shell: bash
        run: |
          set -euo pipefail
          cat .benchmark/current-chunks/part-* > .benchmark/run_benchmark.py.gz
          echo '6f17bf64066064856265acc8a34a356c478064e644859b29ac1ef68e832f823a  .benchmark/run_benchmark.py.gz' \
            | sha256sum --check --strict
          gzip --decompress --stdout .benchmark/run_benchmark.py.gz > .benchmark/run_benchmark.py
          echo '95961a6af209d391e13e653cfefb5e0fa7450b26a52bde33d153e4cf7fdb9156  .benchmark/run_benchmark.py' \
            | sha256sum --check --strict
          python3 -m py_compile .benchmark/run_benchmark.py
          mkdir -p benchmark-artifacts/harness
          cp .benchmark/run_benchmark.py benchmark-artifacts/harness/run_benchmark.py
          sha256sum .benchmark/run_benchmark.py > benchmark-artifacts/harness/SHA256SUMS

      - name: Install distribution toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates \
            curl \
            file \
            ghostscript \
            libvips-tools \
            poppler-utils \
            python3-numpy \
            python3-pil \
            python3-psutil \
            qpdf \
            xz-utils

      - name: Install pinned ImageMagick 7, cpdf, and pdfcpu binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .benchmark/bin .benchmark/imagemagick .benchmark/bin/pdfcpu-unpack

          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-29/ImageMagick-7.1.2-29-gcc-x86_64.AppImage \
            --output .benchmark/imagemagick/ImageMagick.AppImage
          echo 'd43978debd8c25b12c26e368f93de827a8dc45fd13396126ae9b758cd3570485  .benchmark/imagemagick/ImageMagick.AppImage' \
            | sha256sum --check --strict
          chmod 0755 .benchmark/imagemagick/ImageMagick.AppImage
          (
            cd .benchmark/imagemagick
            ./ImageMagick.AppImage --appimage-extract >/dev/null
          )
          cat > .benchmark/bin/magick <<'SH'
          #!/bin/sh
          set -eu
          exec "$GITHUB_WORKSPACE/.benchmark/imagemagick/squashfs-root/AppRun" "$@"
          SH
          chmod 0755 .benchmark/bin/magick

          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/coherentgraphics/cpdf-binaries/6341ce3699e46659bb2b59c216f37d2829ea97f8/Linux-Intel-64bit/cpdf \
            --output .benchmark/bin/cpdf
          chmod 0755 .benchmark/bin/cpdf

          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/pdfcpu/pdfcpu/releases/download/v0.15.0/pdfcpu_0.15.0_Linux_x86_64.tar.xz \
            --output .benchmark/bin/pdfcpu.tar.xz
          echo '652830db95e81868dbe38fbb3f506365511c99a1831b5e8955deac38f3f645f8  .benchmark/bin/pdfcpu.tar.xz' \
            | sha256sum --check --strict
          tar -xJf .benchmark/bin/pdfcpu.tar.xz -C .benchmark/bin/pdfcpu-unpack
          pdfcpu_source=$(find .benchmark/bin/pdfcpu-unpack -type f -name pdfcpu -perm -u+x -print -quit)
          test -n "$pdfcpu_source"
          cp "$pdfcpu_source" .benchmark/bin/pdfcpu
          chmod 0755 .benchmark/bin/pdfcpu
          rm -rf .benchmark/bin/pdfcpu-unpack .benchmark/bin/pdfcpu.tar.xz
          sha256sum .benchmark/bin/cpdf .benchmark/bin/pdfcpu > benchmark-artifacts/harness/tool-binary-SHA256SUMS
          printf '%s\n' "$GITHUB_WORKSPACE/.benchmark/bin" >> "$GITHUB_PATH"

      - name: Smoke-test complete tool capabilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .benchmark/smoke
          python3 - <<'PY'
          from PIL import Image
          Image.new('RGB', (400, 600), (120, 180, 220)).save('.benchmark/smoke/input.jpg', quality=92)
          PY
          magick -version
          magick .benchmark/smoke/input.jpg -format '%w %h\n' info:
          vips --version
          cpdf -jpeg .benchmark/smoke/input.jpg -o .benchmark/smoke/cpdf.pdf
          cpdf -scale-page '1.4886 1.4030' .benchmark/smoke/cpdf.pdf -o .benchmark/smoke/cpdf-a4.pdf
          pdfcpu import -- 'dim:595.44 841.68, pos:c, dpi:300' \
            .benchmark/smoke/pdfcpu.pdf .benchmark/smoke/input.jpg
          qpdf --check .benchmark/smoke/cpdf-a4.pdf
          qpdf --check .benchmark/smoke/pdfcpu.pdf
          rm -rf .benchmark/smoke

      - name: Record tool probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts/probes
          {
            echo '## ImageMagick'
            magick -version 2>&1
            echo '## vips'
            vips --version 2>&1
            echo '## vips thumbnail help'
            vips thumbnail --help-operation 2>&1
            echo '## vips gravity help'
            vips gravity --help-operation 2>&1
            echo '## cpdf'
            cpdf -version 2>&1
            echo '## qpdf'
            qpdf --version 2>&1
            echo '## pdfcpu'
            pdfcpu version 2>&1
            echo '## pdfcpu import help'
            pdfcpu help import 2>&1
          } | tee benchmark-artifacts/probes/tool-probes.txt

      - name: Run complete randomized benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 .benchmark/run_benchmark.py --output benchmark-artifacts \
            2>&1 | tee benchmark-artifacts/benchmark-console.log

      - name: Upload raw evidence and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-pdf-benchmark-${{ github.run_id }}
          path: |
            benchmark-artifacts/REPORT.md
            benchmark-artifacts/SHA256SUMS
            benchmark-artifacts/*.csv
            benchmark-artifacts/*.json
            benchmark-artifacts/*.log
            benchmark-artifacts/harness/
            benchmark-artifacts/logs/
            benchmark-artifacts/probes/
            benchmark-artifacts/representative-outputs/
            benchmark-artifacts/visual-qa/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
